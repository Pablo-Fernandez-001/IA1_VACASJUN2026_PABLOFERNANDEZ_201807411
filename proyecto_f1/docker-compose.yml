services:
  prolog-service:
    build: ./backend/prolog_service
    container_name: doctor-byte-prolog-service
    restart: unless-stopped
    ports:
      - "8001:8001"
    volumes:
      - ./backend/prolog_service/knowledge_base:/app/knowledge_base
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8001/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    networks:
      - doctor-byte-net

  telegram-service:
    build: ./backend/telegram_service
    container_name: doctor-byte-telegram-service
    restart: unless-stopped
    env_file:
      - .env
    environment:
      API_GATEWAY_URL: http://api-gateway:8000
    ports:
      - "8002:8002"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8002/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    networks:
      - doctor-byte-net

  api-gateway:
    build: ./backend/api_gateway
    container_name: doctor-byte-api-gateway
    restart: unless-stopped
    env_file:
      - .env
    environment:
      PROLOG_SERVICE_URL: http://prolog-service:8001
      TELEGRAM_SERVICE_URL: http://telegram-service:8002
      DATABASE_URL: sqlite:///./data/doctor_byte.db
    volumes:
      - doctor-byte-data:/app/data
    ports:
      - "8000:8000"
    depends_on:
      prolog-service:
        condition: service_healthy
      telegram-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    networks:
      - doctor-byte-net

  frontend:
    build: ./frontend
    container_name: doctor-byte-frontend
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-8081}:80"
    depends_on:
      api-gateway:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/ >/dev/null 2>&1 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    networks:
      - doctor-byte-net

networks:
  doctor-byte-net:
    driver: bridge

volumes:
  doctor-byte-data:
