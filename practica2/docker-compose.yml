services:
  api-gateway:
    build: ./backend/api_gateway
    container_name: smartbot-api-gateway
    env_file: .env
    environment:
      DATABASE_URL: ${DATABASE_URL:-sqlite:////data/smartbot.db}
      PROLOG_SERVICE_URL: http://prolog-service:8001
    volumes:
      - smartbot_data:/data
    ports:
      - "${API_PORT:-8000}:8000"
    depends_on:
      - prolog-service

  prolog-service:
    build: ./backend/prolog_service
    container_name: smartbot-prolog-service
    ports:
      - "${PROLOG_PORT:-8001}:8001"

  telegram-bot:
    build: ./backend/telegram_bot
    container_name: smartbot-telegram-bot
    env_file: .env
    environment:
      API_BASE_URL: http://api-gateway:8000
    depends_on:
      - api-gateway
    restart: unless-stopped

  frontend:
    image: nginx:1.27-alpine
    container_name: smartbot-frontend
    volumes:
      - ./frontend:/usr/share/nginx/html:ro
      - ./frontend/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - "${FRONTEND_PORT:-8080}:80"
    depends_on:
      - api-gateway

volumes:
  smartbot_data:
