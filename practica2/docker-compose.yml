services:
  api-gateway:
    build: ./backend/api_gateway
    container_name: smartbot-api-gateway
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DATABASE_URL: ${DATABASE_URL:-sqlite:////data/smartbot.db}
      PROLOG_SERVICE_URL: http://prolog-service:8001
    volumes:
      - smartbot_data:/data
    ports:
      - "${API_PORT:-8100}:8000"
    depends_on:
      prolog-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    networks:
      - smartbot-net

  prolog-service:
    build: ./backend/prolog_service
    container_name: smartbot-prolog-service
    restart: unless-stopped
    ports:
      - "${PROLOG_PORT:-8101}:8001"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8001/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    networks:
      - smartbot-net

  telegram-bot:
    build: ./backend/telegram_bot
    container_name: smartbot-telegram-bot
    env_file:
      - .env
    environment:
      API_BASE_URL: http://api-gateway:8000
    depends_on:
      api-gateway:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - smartbot-net

  frontend:
    image: nginx:1.27-alpine
    container_name: smartbot-frontend
    restart: unless-stopped
    volumes:
      - ./frontend:/usr/share/nginx/html:ro
      - ./frontend/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - "${FRONTEND_PORT:-8090}:80"
    depends_on:
      api-gateway:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/ >/dev/null 2>&1 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    networks:
      - smartbot-net

networks:
  smartbot-net:
    driver: bridge

volumes:
  smartbot_data:
